; Production PHP settings — OPcache on with sensible sizing (compiled
; bytecode cached across requests instead of re-parsed every time — the
; single biggest PHP performance win available with no code changes),
; version disclosure off, and realistic upload limits for product photos.

opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
opcache.validate_timestamps=1
opcache.revalidate_freq=2

expose_php=Off
display_errors=Off
log_errors=On
error_log=/dev/stderr

upload_max_filesize=4M
post_max_size=8M
memory_limit=256M

session.cookie_httponly=1
session.use_strict_mode=1
